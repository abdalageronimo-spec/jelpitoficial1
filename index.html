<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aceptar Cookies</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      
      /* ⬇️ IMAGEN DE FONDO */
      background-image: url('image.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Capa oscura encima de la imagen para que el texto se lea bien */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: -1;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      text-align: center;
      max-width: 420px;
      width: 90%;
    }

    .card h2 {
      color: #333;
      margin-bottom: 15px;
      font-size: 1.6rem;
    }

    .card p {
      color: #666;
      margin-bottom: 30px;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .btn-verde {
      display: inline-block;
      padding: 16px 60px;
      background: #28a745;
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 600;
      text-decoration: none;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
      transition: all 0.3s ease;
      width: 100%;
    }

    .btn-verde:hover {
      background: #218838;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(40, 167, 69, 0.4);
    }

    .btn-verde:active {
      transform: translateY(0);
      box-shadow: 0 2px 10px rgba(40, 167, 69, 0.3);
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🍪 Aceptar Cookies</h2>
    <p>Este sitio web utiliza cookies para mejorar tu experiencia de navegación, analizar el tráfico y personalizar el contenido. Al hacer clic en "Aceptar", consientes el uso de todas las cookies.</p>
    <a href="https://tulink.com" class="btn-verde">Aceptar</a>
  </div>

</body>
</html>
