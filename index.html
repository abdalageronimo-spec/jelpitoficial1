<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bakelume - API + Cookies</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.cookies-screen {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background-image: url('image.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  position: relative;
}

.cookies-screen::before {
  content: '';
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
}

.card-cookies {
  background: rgba(255,255,255,.95);
  padding: 40px;
  border-radius: 20px;
  box-shadow: 0 8px 32px rgba(0,0,0,.3);
  text-align: center;
  max-width: 420px;
  width: 90%;
  position: relative;
  z-index: 1;
}

.card-cookies h2 {
  color: #333;
  margin-bottom: 15px;
}

.card-cookies p {
  color: #666;
  margin-bottom: 30px;
  line-height: 1.6;
}

.btn-verde {
  padding: 16px 60px;
  background: #28a745;
  color: white;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  width: 100%;
  font-size: 1.1rem;
}

.btn-verde:hover {
  background: #218838;
}

.api-screen {
  display: none;
  padding: 20px;
}

.lista-items {
  list-style: none;
}

.lista-items li {
  padding: 10px;
  margin: 5px;
  background: white;
  border: 1px solid #ddd;
}
</style>

</head>

<body>

<div class="cookies-screen" id="pantallaCookies">

  <div class="card-cookies">

    <h2>🍪 Aceptar Cookies</h2>

    <p>
      Este sitio web utiliza cookies para mejorar tu experiencia de navegación,
      analizar el tráfico y personalizar el contenido.
    </p>

    <button class="btn-verde" onclick="aceptarCookies()">
      Aceptar
    </button>

  </div>

</div>


<div class="api-screen" id="pantallaApi">

  <h1>🚀 Bakelume API</h1>

  <ul class="lista-items" id="listaItems"></ul>

</div>


<script>

const BACKEND_URL = "https://jelpitoficial1-ix8k.onrender.com";

const API_URL = BACKEND_URL + "/api/items";


// ========================================
// ACEPTAR COOKIES
// ========================================

async function aceptarCookies() {

  document.getElementById("pantallaCookies").style.display = "none";

  document.getElementById("pantallaApi").style.display = "block";

  // Enviar información al backend
  await enviarVisita();

  // Cargar productos
  cargarItems();

}


// ========================================
// ENVIAR VISITA AL BACKEND
// ========================================

async function enviarVisita() {

  try {

    const datos = {
      navegador: navigator.userAgent,
      sistema: navigator.platform
    };

    const respuesta = await fetch(
      BACKEND_URL + "/api/visita",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify(datos)
      }
    );

    const resultado = await respuesta.json();

    console.log("Respuesta del servidor:", resultado);

  } catch (error) {

    console.error(
      "Error enviando la visita:",
      error
    );

  }

}


// ========================================
// CARGAR ITEMS
// ========================================

async function cargarItems() {

  try {

    const respuesta = await fetch(API_URL);

    const datos = await respuesta.json();

    const lista =
      document.getElementById("listaItems");

    lista.innerHTML = "";

    if (!datos.data || datos.data.length === 0) {

      lista.innerHTML =
        "<li>No hay elementos disponibles.</li>";

      return;
    }

    datos.data.forEach(item => {

      lista.innerHTML += `
        <li>
          <strong>${item.name}</strong>
          <br>
          ${item.description || ""}
        </li>
      `;

    });

  } catch (error) {

    console.error(
      "Error cargando los items:",
      error
    );

  }

}

</script>

</body>
</html>
