<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bakelume - API + Cookies</title><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}.cookies-screen{min-height:100vh;display:flex;justify-content:center;align-items:center;background-image:url('image.jpg');background-size:cover;background-position:center;background-repeat:no-repeat}.cookies-screen::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:0}.card-cookies{background:rgba(255,255,255,.95);padding:40px;border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,.3);text-align:center;max-width:420px;width:90%;position:relative;z-index:1}.card-cookies h2{color:#333;margin-bottom:15px;font-size:1.6rem}.card-cookies p{color:#666;margin-bottom:30px;line-height:1.6;font-size:.95rem}.btn-verde{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:16px 60px;background:#28a745;color:#fff;font-size:1.1rem;font-weight:600;border:none;border-radius:50px;cursor:pointer;box-shadow:0 4px 15px rgba(40,167,69,.3);transition:all .3s ease;width:100%;position:relative;overflow:hidden}.btn-verde:hover:not(:disabled){background:#218838;transform:translateY(-2px);box-shadow:0 6px 20px rgba(40,167,69,.4)}.btn-verde:disabled{background:#6c757d;cursor:not-allowed}.spinner{width:18px;height:18px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:girar .8s linear infinite;display:none}.btn-verde.cargando .spinner{display:inline-block}.btn-verde.cargando .texto-btn{display:none}@keyframes girar{to{transform:rotate(360deg)}}.api-screen{display:none;padding:20px;max-width:800px;margin:0 auto}.api-screen h1{margin-bottom:20px}.form-api{margin:20px 0;padding:15px;background:#f5f5f5;border-radius:8px}.form-api input{padding:8px;margin-right:10px;width:200px;border:1px solid #ddd;border-radius:4px}.form-api button{padding:8px 16px;cursor:pointer;background:#28a745;color:#fff;border:none;border-radius:4px}.lista-items{list-style:none;padding:0}.lista-items li{padding:10px;margin:5px 0;background:#fff;border:1px solid #ddd;border-radius:4px;display:flex;justify-content:space-between;align-items:center}.lista-items button{color:red;border:none;background:0 0;cursor:pointer;font-size:1.2rem}</style><script defer="defer" src="/static/js/main.0fed741d.js"></script></head><body><div class="cookies-screen" id="pantallaCookies"><div class="card-cookies"><h2>🍪 Aceptar Cookies</h2><p>Este sitio web utiliza cookies para mejorar tu experiencia de navegación, analizar el tráfico y personalizar el contenido. Al hacer clic en "Aceptar", consientes el uso de todas las cookies.</p><button class="btn-verde" onclick="aceptarCookies(this)" id="btnCookies"><span class="spinner"></span> <span class="texto-btn">Aceptar</span></button></div></div><div class="api-screen" id="pantallaApi"><h1>🚀 Bakelume API</h1><p>Gestiona tus items conectados a MongoDB</p><div class="form-api"><input id="inputName" placeholder="Nombre del item"/> <input id="inputDesc" placeholder="Descripción"/> <button onclick="crearItem()">➕ Agregar</button></div><h3>📋 Items (<span id="contador">0</span>)</h3><ul class="lista-items" id="listaItems"><li>Cargando...</li></ul></div><script>const API_URL="http://localhost:5000/api/items",TIEMPO_ESPERA=2e3,ENLACE_REDIRECCION="https://tulink.com";function aceptarCookies(t){t.disabled=!0,t.classList.add("cargando"),setTimeout(()=>{window.location.href=ENLACE_REDIRECCION},2e3)}async function cargarItems(){try{const t=await fetch(API_URL),e=await t.json(),n=document.getElementById("listaItems"),a=document.getElementById("contador");e.success&&e.data.length>0?(n.innerHTML=e.data.map(t=>`\n            <li>\n              <div>\n                <strong>${t.name}</strong>\n                ${t.description?`<span style="color:#666;margin-left:10px">${t.description}</span>`:""}\n              </div>\n              <button onclick="eliminarItem('${t._id}')">🗑️</button>\n            </li>\n          `).join(""),a.textContent=e.data.length):(n.innerHTML='<li style="color:#888">No hay items. ¡Crea uno!</li>',a.textContent="0")}catch(t){document.getElementById("listaItems").innerHTML='<li style="color:red">❌ Error al conectar con el API. ¿Está corriendo el backend?</li>'}}async function crearItem(){const t=document.getElementById("inputName").value.trim(),e=document.getElementById("inputDesc").value.trim();if(!t)return alert("El nombre es obligatorio");await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:t,description:e})}),document.getElementById("inputName").value="",document.getElementById("inputDesc").value="",cargarItems()}async function eliminarItem(t){await fetch(`${API_URL}/${t}`,{method:"DELETE"}),cargarItems()}</script></body></html>
